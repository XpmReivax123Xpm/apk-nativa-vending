# Broker de desarrollo para el spike de MQTT y para probar la APK en el emulador.
#
# Se corre DESDE ESTA CARPETA, para que las rutas relativas resuelvan aca:
#   mosquitto -c mosquitto.conf -v
#
# Produccion NO usa este archivo: alla va 8883 con TLS, su propio password_file y persistencia.

listener 1883 0.0.0.0

allow_anonymous false
password_file ./passwd
acl_file ./acl

# El clientId tiene que ser el usuario: una maquina no puede aparecer como otra.
use_username_as_clientid true

log_dest stdout
log_type all
